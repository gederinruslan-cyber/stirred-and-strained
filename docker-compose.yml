# Local stack: postgres, api, web. `docker compose up` needs no .env: every variable has a
# local-only default (documented in .env.example). Published ports bind to 127.0.0.1 only.
# Day-to-day: `docker compose up -d postgres` and `pnpm dev` on the host. `pnpm verify:quick`
# and `pnpm verify:full` run this file as their own project `stirred-verify` on other ports.
name: stirred

services:
  postgres:
    image: postgres:18.6-trixie
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stirred}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stirred_local_only}
      POSTGRES_DB: ${POSTGRES_DB:-stirred}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5543}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 3s
      timeout: 5s
      retries: 20

  db-setup:
    # One-shot: roles (as the image superuser, its only use), migrations and the house library
    # (data/seed), then exit 0. Both steps are repeatable.
    build: { context: ., target: deps }
    command: ["sh", "-c", "node packages/db/src/cli.ts setup && node packages/db/src/cli.ts seed"]
    environment:
      DATABASE_ADMIN_URL: postgres://${POSTGRES_USER:-stirred}:${POSTGRES_PASSWORD:-stirred_local_only}@postgres:5432/${POSTGRES_DB:-stirred}
      MIGRATION_DATABASE_URL: postgres://stirred_migrator:${MIGRATOR_DB_PASSWORD:-stirred_migrator_local_only}@postgres:5432/${POSTGRES_DB:-stirred}
      MIGRATOR_DB_PASSWORD: ${MIGRATOR_DB_PASSWORD:-stirred_migrator_local_only}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-stirred_app_local_only}
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build: { context: ., target: api }
    environment:
      # The runtime role: no superuser, no BYPASSRLS, owns nothing (ADR 0003).
      PUBLIC_ORIGIN: http://127.0.0.1:${WEB_PORT:-3300}
      DATABASE_URL: postgres://stirred_app:${APP_DB_PASSWORD:-stirred_app_local_only}@postgres:5432/${POSTGRES_DB:-stirred}
    ports:
      - "127.0.0.1:${API_PORT:-4300}:4000"
    depends_on:
      db-setup: { condition: service_completed_successfully }
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"
      interval: 3s
      timeout: 5s
      retries: 20

  web:
    build: { context: ., target: web }
    environment:
      API_URL: http://api:4000
      PUBLIC_ORIGIN: http://127.0.0.1:${WEB_PORT:-3300}
    ports:
      - "127.0.0.1:${WEB_PORT:-3300}:3000"
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"
      interval: 3s
      timeout: 5s
      retries: 30

volumes:
  postgres-data:
