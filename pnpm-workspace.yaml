# pnpm settings (pnpm >= 11 reads them here, not from package.json).
packages:
  - apps/*
  - packages/*
  - e2e

# Installing with a Node version outside the root engines range fails.
engineStrict: true

# Dependencies allowed to run install scripts; any other fails the install.
allowBuilds:
  esbuild: true
  # Ships prebuilt binaries as optional dependencies; the native fallback is not needed.
  unrs-resolver: false
  sharp: false

# Shared dependency versions; workspaces reference them with "catalog:".
catalog:
  "@types/node": ^24.0.0
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  fast-check: ^4.10.2
  fastify: ^5.12.7
  next: ^16.4.2
  prettier: ^3.9.10
  react: ^19.3.1
  react-dom: ^19.3.1
  # ~6.0.x, never ^6: typescript-eslint 8.71.2 peers on typescript <6.1.0.
  typescript: ~6.0.3
  vitest: ^5.0.5
