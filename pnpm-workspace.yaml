# pnpm settings (pnpm >= 11 reads them here, not from package.json).
packages:
  - apps/*
  - packages/*
  - e2e

# Installing with a Node version outside the root engines range fails.
engineStrict: true

# Dependencies allowed to run install scripts; any other fails the install.
allowBuilds:
  esbuild: true
  # Ships prebuilt binaries as optional dependencies; the native fallback is not needed.
  unrs-resolver: false
  sharp: false

# Shared dependency versions; workspaces reference them with "catalog:".
catalog:
  "@axe-core/playwright": ^4.11.0
  "@fastify/swagger": ^9.9.2
  "@playwright/test": ^1.64.1
  "@types/node": ^24.0.0
  "@types/pg": ^8.23.1
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  # Pinned exactly: typed queries over user data; bumps run verify:full.
  drizzle-orm: 0.45.3
  fast-check: ^4.10.2
  fastify: ^5.12.7
  fastify-type-provider-zod: ^7.0.0
  next: ^16.4.2
  # The typed API client runtime.
  openapi-fetch: ^0.17.0
  openapi-types: ^12.1.3
  # Generates packages/api-client types from the committed contract (dev only).
  openapi-typescript: ^7.13.0
  pg: ^8.23.1
  prettier: ^3.9.10
  react: ^19.3.1
  react-dom: ^19.3.1
  # Marks the web's API module server-only: a client-component import fails the build.
  server-only: ^0.0.1
  # ~6.0.x, never ^6: typescript-eslint 8.71.2 peers on typescript <6.1.0.
  typescript: ~6.0.3
  vitest: ^5.0.5
  zod: ^4.6.7

# openapi-typescript 7.13 peers on typescript 5 and runs fine on 6.0.
peerDependencyRules:
  allowedVersions:
    "openapi-typescript>typescript": "6"
